name: Notebook completo da CNN (treino + app)
on:
  push:
  workflow_dispatch:
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt nbconvert ipykernel
      - name: Executar o notebook do início ao fim (baixa o EuroSAT e treina os 6 experimentos)
        env:
          CNN_ROOT: ${{ github.workspace }}
        run: jupyter nbconvert --to notebook --execute notebooks/Territory_Vision.ipynb --output-dir executado --ExecutePreprocessor.timeout=4800
      - name: Resumo dos resultados
        run: |
          python -c "import json;r=json.load(open('outputs/results.json'));print('Selecionada:',r['best']);[print(e['config']['name'],round(e['val_accuracy'],4),e['epochs_run']) for e in r['experiments']];print('Acurácia teste:',r['test_report']['accuracy'])"
      - name: Teste de fumaça do app Gradio
        run: python tests/smoke_app.py
      - name: Exportar notebook executado e resultados (base64 no log)
        if: always()
        run: |
          tar czf /tmp/resultado.tgz executado outputs/results.json outputs/split.json outputs/*.png
          echo "=====INICIO-RESULTADO====="; base64 -w 0 /tmp/resultado.tgz; echo; echo "=====FIM-RESULTADO====="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-executado
          path: |
            executado/Territory_Vision.ipynb
            outputs/results.json
            outputs/split.json
            outputs/*.png
